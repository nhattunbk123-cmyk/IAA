<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%">
  <!-- Laptop Dell Gaming G15 -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="260" height="165" rx="6" fill="#181a20" stroke="#333846" stroke-width="2"/>
    <circle cx="130" cy="5" r="2" fill="#475569"/>
    <rect x="8" y="9" width="244" height="147" rx="3" fill="#0b1114"/>
    
    <!-- Dell G15 Teal Cyber graphics -->
    <circle cx="130" cy="80" r="38" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <text x="130" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#22d3ee" text-anchor="middle">G15</text>
    <text x="130" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#99f6e4" text-anchor="middle" letter-spacing="2">DELL GAMING</text>

    <!-- Hinge -->
    <rect x="80" y="165" width="100" height="6" fill="#2d323f"/>
  </g>

  <!-- Laptop Base -->
  <polygon points="10,190 310,190 320,225 0,225" fill="#1b1e26" stroke="#2c3240" stroke-width="1.5"/>
  <polygon points="35,193 285,193 292,213 28,213" fill="#0f1117" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.6"/>
  <rect x="125" y="216" width="70" height="7" rx="1.5" fill="#141720" stroke="#333846" stroke-width="0.8"/>
</svg>
