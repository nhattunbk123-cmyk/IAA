services:
  vulnshop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnshop-lab
    # BẮT BUỘC: Chỉ bind vào địa chỉ loopback 127.0.0.1 để bảo vệ mạng lab cục bộ
    ports:
      - "0.0.0.0:5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - FLASK_DEBUG=0
      - SECRET_KEY=vulnshop-lab-compose-secret-key-2026
      - DATABASE_PATH=/app/instance/vulnshop.db
    volumes:
      - ./instance:/app/instance
      - ./app:/app/app
      - ./tests:/app/tests
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/system/debug-info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
