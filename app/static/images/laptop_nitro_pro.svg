<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%">
  <!-- Laptop Acer Gaming Nitro ProPanel -->
  <defs>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="260" height="165" rx="6" fill="#181a20" stroke="#333846" stroke-width="2"/>
    <circle cx="130" cy="5" r="2" fill="#475569"/>
    <rect x="8" y="9" width="244" height="147" rx="3" fill="#0f0706"/>
    
    <!-- Red glowing flames & NITRO PROPANEL text -->
    <path d="M40 120 Q130 30 220 120 Z" fill="#b91c1c" opacity="0.4" filter="url(#flameGlow)"/>
    <text x="130" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#f87171" text-anchor="middle" letter-spacing="2" filter="url(#flameGlow)">NITRO PROPANEL</text>
    <polygon points="120,90 140,90 130,115" fill="#f59e0b"/>
    <text x="130" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#fed7aa" text-anchor="middle" letter-spacing="1">ANV15-52-50VA</text>

    <!-- Hinge -->
    <rect x="80" y="165" width="100" height="6" fill="#2d323f"/>
  </g>

  <!-- Laptop Base -->
  <polygon points="10,190 310,190 320,225 0,225" fill="#1b1e26" stroke="#2c3240" stroke-width="1.5"/>
  <polygon points="35,193 285,193 292,213 28,213" fill="#0f1117" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.7"/>
  <rect x="125" y="216" width="70" height="7" rx="1.5" fill="#141720" stroke="#333846" stroke-width="0.8"/>
</svg>
